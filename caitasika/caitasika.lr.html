<!DOCTYPE html>
<html lang="si" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>චෛතසික 52 නාමාවලිය සහ ලක්ඛණාදි විවරණය</title>
  <link rel="manifest" href="../manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+Sinhala:wght@400;600;700&family=Tiro+Devanagari+Sanskrit:ital@0;1&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Noto Serif Sinhala', 'Inter', serif;
      transition: background-color 0.3s ease, color 0.3s ease;
      font-size: 15px;
    }
    .sinhala-font {
      font-family: 'Noto Serif Sinhala', serif;
    }
    p, .justify-text {
      text-align: justify;
      text-justify: inter-word;
      word-spacing: 0.04em;
      line-height: 1.75;
    }
    li {
      text-align: justify;
      text-justify: inter-word;
      line-height: 1.65;
    }
    .pali-box {
      font-family: 'Noto Serif Sinhala', 'Tiro Devanagari Sanskrit', serif;
      letter-spacing: 0.02em;
    }

    /* Dark Mode */
    html.dark body {
      background-color: #0b1120;
      color: #f1f5f9;
    }
    html.dark .list-item-card {
      background: rgba(30, 41, 59, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    html.dark .list-item-card:hover {
      border-color: rgba(245, 158, 11, 0.45);
    }
    html.dark .sub-box {
      background-color: rgba(15, 23, 42, 0.65);
      border-color: rgba(51, 65, 85, 0.7);
    }
    html.dark .pali-quote {
      background-color: #0f172a;
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #fde68a;
    }
    html.dark .pali-sub-badge {
      background-color: rgba(245, 158, 11, 0.15);
      color: #fde68a;
      border: 1px solid rgba(245, 158, 11, 0.25);
    }

    /* Light Mode */
    html:not(.dark) body {
      background: linear-gradient(135deg, #fdfbf7 0%, #fff7ed 50%, #fef3c7 100%);
      color: #1e293b;
    }
    html:not(.dark) .list-item-card {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(245, 158, 11, 0.25);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    html:not(.dark) .list-item-card:hover {
      border-color: rgba(217, 119, 6, 0.5);
    }
    html:not(.dark) .sub-box {
      background-color: #fffbeb;
      border-color: #fde68a;
    }
    html:not(.dark) .pali-quote {
      background-color: #fffbeb;
      border: 1px solid #fcd34d;
      color: #78350f;
    }
    html:not(.dark) .pali-sub-badge {
      background-color: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
    }

    /* Badges */
    .badge-amber {
      background-color: rgba(245, 158, 11, 0.15);
      color: #d97706;
      border: 1px solid rgba(245, 158, 11, 0.35);
    }
    html.dark .badge-amber { color: #fbbf24; }

    .badge-emerald {
      background-color: rgba(16, 185, 129, 0.15);
      color: #059669;
      border: 1px solid rgba(16, 185, 129, 0.35);
    }
    html.dark .badge-emerald { color: #34d399; }

    .badge-rose {
      background-color: rgba(244, 63, 94, 0.15);
      color: #e11d48;
      border: 1px solid rgba(244, 63, 94, 0.35);
    }
    html.dark .badge-rose { color: #fb7185; }

    .badge-sky {
      background-color: rgba(14, 165, 233, 0.15);
      color: #0284c7;
      border: 1px solid rgba(14, 165, 233, 0.35);
    }
    html.dark .badge-sky { color: #38bdf8; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Header -->
  <header class="sticky top-0 z-50 bg-white/95 dark:bg-slate-900/90 backdrop-blur-md border-b border-amber-200/50 dark:border-slate-800 transition">
    <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <a href="./caitasika.html" class="text-amber-500 hover:text-amber-600 dark:hover:text-amber-400 p-2 rounded-xl hover:bg-amber-100/50 dark:hover:bg-slate-800 transition">
          <i class="fa-solid fa-arrow-left text-lg"></i>
        </a>
        <div>
          <h1 class="text-base sm:text-lg font-bold text-amber-600 dark:text-amber-400 tracking-wide sinhala-font">චෛතසික 52 නාමාවලිය</h1>
          <p class="text-[11px] sm:text-xs text-slate-500 dark:text-slate-400">ක්ලික් කර විස්තර නරඹන්න (ලක්ඛණ, රස, පච්චුපට්ඨාන, පදට්ඨාන)</p>
        </div>
      </div>

      <div class="flex items-center space-x-2">
        <button 
          id="theme-toggle" 
          onclick="toggleTheme()" 
          title="වර්ණ මාදිලිය මාරු කරන්න"
          class="p-2 rounded-xl border border-amber-300 dark:border-slate-700 bg-amber-50 dark:bg-slate-800 text-amber-600 dark:text-amber-400 hover:bg-amber-100 dark:hover:bg-slate-700 shadow-sm transition">
          <i id="theme-toggle-icon" class="fa-solid fa-sun text-base"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-6 space-y-5">

    <!-- Search & Filter Controls -->
    <section class="space-y-3">
      <div class="relative w-full">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
        <input 
          type="text" 
          id="search-input" 
          placeholder="චෛතසිකයේ නම හෝ පාලි පාඨය සොයන්න..." 
          class="w-full pl-10 pr-4 py-2.5 bg-white dark:bg-slate-800 border border-amber-200 dark:border-slate-700 rounded-xl text-sm text-slate-700 dark:text-slate-200 placeholder-slate-400 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 shadow-sm transition">
      </div>

      <!-- Category Filter Tabs -->
      <div class="flex flex-wrap gap-2" id="category-tabs">
        <button onclick="filterCategory('ALL', this)" class="category-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-amber-500 text-white dark:text-slate-900 shadow">සියල්ල (52)</button>
        <button onclick="filterCategory('සබ්බචිත්ත සාධාරණ', this)" class="category-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-amber-200 dark:border-slate-700 hover:bg-amber-50 dark:hover:bg-slate-700">සබ්බචිත්ත සාධාරණ (7)</button>
        <button onclick="filterCategory('ප්‍රකීර්ණක', this)" class="category-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-amber-200 dark:border-slate-700 hover:bg-amber-50 dark:hover:bg-slate-700">ප්‍රකීර්ණක (6)</button>
        <button onclick="filterCategory('අකුසල', this)" class="category-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-amber-200 dark:border-slate-700 hover:bg-amber-50 dark:hover:bg-slate-700">අකුසල (14)</button>
        <button onclick="filterCategory('සෝභන', this)" class="category-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-amber-200 dark:border-slate-700 hover:bg-amber-50 dark:hover:bg-slate-700">සෝභන (25)</button>
      </div>
    </section>

    <!-- Accordion List Container -->
    <section id="caitasika-list-container" class="space-y-2.5"></section>

  </main>

  <footer class="mt-auto border-t border-amber-200/60 dark:border-slate-800 bg-white/70 dark:bg-slate-950/80 py-4 text-center text-xs text-slate-500">
    අභිධර්ම මාතිකා අධ්‍යයන යෙදුම • චෛතසික 52 නාමාවලිය
  </footer>

  <script src="./caitasika.lr.js"></script>
  <script>
    let activeFilter = 'ALL';
    let searchQuery = '';
    let openItemId = null;

    function initTheme() {
      const savedTheme = localStorage.getItem('abhidhamma_theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (savedTheme === 'light') {
        document.documentElement.classList.remove('dark');
        updateThemeIcon(false);
      } else {
        document.documentElement.classList.add('dark');
        updateThemeIcon(true);
      }
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('abhidhamma_theme', isDark ? 'dark' : 'light');
      updateThemeIcon(isDark);
    }

    function updateThemeIcon(isDark) {
      const icon = document.getElementById('theme-toggle-icon');
      if (icon) {
        icon.className = isDark ? 'fa-solid fa-sun text-base' : 'fa-solid fa-moon text-base';
      }
    }

    // Flatten the data structure into a single array
    function flattenItems() {
      let flatList = [];
      if (typeof CAITASIKA_LR_DATA !== 'undefined' && CAITASIKA_LR_DATA.categories) {
        CAITASIKA_LR_DATA.categories.forEach(cat => {
          if (cat.items) {
            cat.items.forEach(item => flatList.push({ ...item, group: cat.categoryName }));
          }
          if (cat.subCategories) {
            cat.subCategories.forEach(sub => {
              if (sub.items) {
                sub.items.forEach(item => flatList.push({ ...item, group: cat.categoryName, subGroup: sub.subCategoryName }));
              }
            });
          }
        });
      }
      // Add display index
      flatList.forEach((item, index) => {
        item.displayIndex = index + 1;
      });
      return flatList;
    }

    // Toggle accordion
    function toggleAccordion(id) {
      openItemId = openItemId === id ? null : id;
      renderList();
    }

    // Filter by category
    function filterCategory(catKey, btnElement) {
      activeFilter = catKey;
      document.querySelectorAll('.category-btn').forEach(btn => {
        btn.className = 'category-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-amber-200 dark:border-slate-700 hover:bg-amber-50 dark:hover:bg-slate-700 transition';
      });
      btnElement.className = 'category-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-amber-500 text-white dark:text-slate-900 shadow transition';
      renderList();
    }

    // Get badge class based on group
    function getBadgeClass(group) {
      if (group.includes('අකුසල')) return 'badge-rose';
      if (group.includes('සෝභන')) return 'badge-emerald';
      if (group.includes('ප්‍රකීර්ණක')) return 'badge-sky';
      return 'badge-amber';
    }

    // Render the list
    function renderList() {
      const container = document.getElementById('caitasika-list-container');
      const allItems = flattenItems();

      const filtered = allItems.filter(item => {
        const matchesFilter = activeFilter === 'ALL' || item.group.includes(activeFilter);
        const matchesSearch = !searchQuery || 
          item.name.toLowerCase().includes(searchQuery) ||
          (item.lakkhana?.sinhala && item.lakkhana.sinhala.toLowerCase().includes(searchQuery)) ||
          (item.lakkhana?.pali && item.lakkhana.pali.toLowerCase().includes(searchQuery)) ||
          (item.pali_definition && item.pali_definition.toLowerCase().includes(searchQuery));
        return matchesFilter && matchesSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="py-12 text-center text-slate-500 text-sm">
            <i class="fa-regular fa-folder-open text-3xl mb-2 block"></i>
            චෛතසිකයක් හමු නොවීය.
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(item => {
        const isOpen = openItemId === String(item.displayIndex);
        return `
          <div class="list-item-card rounded-2xl overflow-hidden transition-all duration-200">
            <!-- Clickable Row Header -->
            <button 
              type="button" 
              onclick="toggleAccordion('${item.displayIndex}')" 
              class="w-full px-4 py-3.5 flex items-center justify-between text-left focus:outline-none transition hover:bg-amber-50/40 dark:hover:bg-slate-800/40">
              
              <div class="flex items-center space-x-3 sm:space-x-4">
                <span class="w-7 h-7 flex items-center justify-center rounded-xl bg-amber-100 dark:bg-slate-800 text-amber-700 dark:text-amber-300 font-bold text-xs border border-amber-200 dark:border-slate-700 flex-shrink-0">
                  ${item.displayIndex}
                </span>
                <div>
                  <h3 class="font-bold text-base sm:text-lg text-slate-800 dark:text-slate-100 sinhala-font">${item.name}</h3>
                  <div class="flex items-center gap-2 mt-0.5">
                    <span class="text-[11px] font-semibold px-2 py-0.5 rounded ${getBadgeClass(item.group)}">
                      ${item.subGroup ? item.subGroup : item.group} චෛතසික
                    </span>
                  </div>
                </div>
              </div>

              <div class="flex items-center space-x-2 text-slate-400 pr-1">
                <i class="fa-solid fa-chevron-down text-sm transition-transform duration-200 ${isOpen ? 'rotate-180 text-amber-500' : ''}"></i>
              </div>
            </button>

            <!-- Expanded Details -->
            ${isOpen ? `
              <div class="p-5 border-t border-amber-200/40 dark:border-slate-700/60 space-y-4 bg-amber-50/20 dark:bg-slate-900/40">
                
                ${item.pali_definition ? `
                  <div class="pali-quote p-3.5 rounded-xl text-sm font-semibold leading-relaxed shadow-sm">
                    <div class="flex items-start gap-2">
                      <i class="fa-solid fa-quote-left text-amber-500 text-sm mt-0.5 opacity-80"></i>
                      <div class="pali-box flex-1">
                        <span class="block text-[11px] uppercase tracking-wider opacity-75 mb-1 font-bold">පාලි නිද්දේසය:</span>
                        <span>${item.pali_definition}</span>
                      </div>
                    </div>
                  </div>
                ` : ''}

                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs md:text-sm">
                  <!-- 1. ලක්ඛණ -->
                  ${item.lakkhana ? `
                    <div class="sub-box p-3 rounded-xl border space-y-1">
                      <div class="flex justify-between items-center border-b border-amber-200/40 dark:border-slate-700/50 pb-1">
                        <span class="font-bold text-amber-600 dark:text-amber-400 text-xs">1. ලක්ඛණ</span>
                        ${item.lakkhana.pali ? `<span class="pali-sub-badge px-2 py-0.5 rounded text-[11px] font-semibold pali-box">${item.lakkhana.pali}</span>` : ''}
                      </div>
                      <p class="text-slate-700 dark:text-slate-200 pt-1">${item.lakkhana.sinhala}</p>
                    </div>
                  ` : ''}

                  <!-- 2. රස -->
                  ${item.rasa ? `
                    <div class="sub-box p-3 rounded-xl border space-y-1">
                      <div class="flex justify-between items-center border-b border-sky-200/40 dark:border-slate-700/50 pb-1">
                        <span class="font-bold text-sky-600 dark:text-sky-400 text-xs">2. රස (කිච්ච/සම්පත්ති)</span>
                        ${item.rasa.pali ? `<span class="pali-sub-badge px-2 py-0.5 rounded text-[11px] font-semibold pali-box">${item.rasa.pali}</span>` : ''}
                      </div>
                      <p class="text-slate-700 dark:text-slate-200 pt-1">${item.rasa.sinhala}</p>
                    </div>
                  ` : ''}

                  <!-- 3. පච්චුපට්ඨාන -->
                  ${item.paccupatthana ? `
                    <div class="sub-box p-3 rounded-xl border space-y-1">
                      <div class="flex justify-between items-center border-b border-emerald-200/40 dark:border-slate-700/50 pb-1">
                        <span class="font-bold text-emerald-600 dark:text-emerald-400 text-xs">3. පච්චුපට්ඨාන</span>
                        ${item.paccupatthana.pali ? `<span class="pali-sub-badge px-2 py-0.5 rounded text-[11px] font-semibold pali-box">${item.paccupatthana.pali}</span>` : ''}
                      </div>
                      <p class="text-slate-700 dark:text-slate-200 pt-1">${item.paccupatthana.sinhala}</p>
                    </div>
                  ` : ''}

                  <!-- 4. පදට්ඨාන -->
                  ${item.padatthana ? `
                    <div class="sub-box p-3 rounded-xl border space-y-1">
                      <div class="flex justify-between items-center border-b border-rose-200/40 dark:border-slate-700/50 pb-1">
                        <span class="font-bold text-rose-600 dark:text-rose-400 text-xs">4. පදට්ඨාන</span>
                        ${item.padatthana.pali ? `<span class="pali-sub-badge px-2 py-0.5 rounded text-[11px] font-semibold pali-box">${item.padatthana.pali}</span>` : ''}
                      </div>
                      <p class="text-slate-700 dark:text-slate-200 pt-1">${item.padatthana.sinhala}</p>
                    </div>
                  ` : ''}
                </div>

                <!-- විශේෂ විස්තර -->
                ${item.notes && item.notes.length > 0 ? `
                  <div class="pt-2 border-t border-amber-200/30 dark:border-slate-800">
                    <span class="text-xs font-bold text-slate-500 dark:text-slate-400 flex items-center gap-1 mb-1">
                      <i class="fa-solid fa-circle-info text-amber-500"></i> විශේෂ අර්ථ විවරණ:
                    </span>
                    <ul class="list-disc list-inside text-xs text-slate-600 dark:text-slate-300 space-y-1 pl-1">
                      ${item.notes.map(n => `<li>${n}</li>`).join('')}
                    </ul>
                  </div>
                ` : ''}

              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    document.addEventListener('DOMContentLoaded', () => {
      initTheme();
      renderList();
      document.getElementById('search-input').addEventListener('input', (e) => {
        searchQuery = e.target.value.toLowerCase().trim();
        renderList();
      });
    });
  </script>
</body>
</html>
